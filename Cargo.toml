[package]
name = "synapse-agent"
version = "2.6.7"
edition = "2021"
description = "Local MyGRACE agent engineering toolkit for OpenCode"
authors = ["Synapse Contributors"]
license = "Apache-2.0"
repository = "https://github.com/anyagixx/synapse"
homepage = "https://github.com/anyagixx/synapse"
readme = "README.md"
keywords = ["ai", "agents", "mygrace", "mcp", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[lib]
name = "syn"
path = "src/lib.rs"

[features]
default = []
telemetry = ["dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry"]

[[bin]]
name = "syn"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.27", features = ["trace"], optional = true }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "trace"], optional = true }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"], optional = true }
tracing-opentelemetry = { version = "0.28", optional = true }
tree-sitter = "0.24"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
ignore = "0.4"
walkdir = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
sha2 = "0.10"
colored = "2"
notify = "8"
globset = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
rayon = "1"
tempfile = "3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "search"
harness = false

[[bench]]
name = "graph"
harness = false

[[bench]]
name = "cascade"
harness = false

[target.'cfg(all(target_os = "macos", target_arch = "x86_64"))'.dependencies]
fastembed = { version = "5.13.4", default-features = false, features = ["ort-load-dynamic", "hf-hub-rustls-tls"] }

[target.'cfg(not(all(target_os = "macos", target_arch = "x86_64")))'.dependencies]
fastembed = { version = "5.13.4", default-features = false, features = ["ort-download-binaries-rustls-tls", "hf-hub-rustls-tls"] }

[build-dependencies]
toml = "0.8"
