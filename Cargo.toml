[package]
name = "syn"
version = "0.2.0"
edition = "2021"
description = "Unified AI Agent Engineering Platform"
authors = ["Synapse Contributors"]
license = "Apache-2.0"
repository = "https://github.com/synapse-ai/synapse"
homepage = "https://synapse.dev"
readme = "README.md"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tree-sitter = "0.24"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
ignore = "0.4"
walkdir = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
sha2 = "0.10"
colored = "2"
notify = "7"
globset = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }

[build-dependencies]
toml = "0.8"

[dev-dependencies]
tempfile = "3"
