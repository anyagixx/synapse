[workspace]
members = ["syn-core", "syn-engine", "syn-proxy", "syn-run", "syn-skills", "syn-mcp", "syn-cli"]
resolver = "2"

[workspace.package]
version = "2.6.8"
edition = "2021"
authors = ["Synapse Contributors"]
license = "Apache-2.0"
repository = "https://github.com/anyagixx/synapse"
homepage = "https://github.com/anyagixx/synapse"
keywords = ["ai", "agents", "mygrace", "mcp", "developer-tools"]
categories = ["command-line-utilities", "development-tools"]

[workspace.dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
tokio = { version = "1", features = ["full", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
opentelemetry = { version = "0.27", features = ["trace"] }
opentelemetry-otlp = { version = "0.27", features = ["grpc-tonic", "trace"] }
opentelemetry_sdk = { version = "0.27", features = ["rt-tokio"] }
tracing-opentelemetry = "0.28"
tree-sitter = "0.24"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
ignore = "0.4"
walkdir = "2"
regex = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"
sha2 = "0.10"
colored = "2"
notify = "8"
globset = "0.4"
rusqlite = { version = "0.31", features = ["bundled"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
rayon = "1"
tempfile = "3"
fastembed = { version = "5.13.4", default-features = false }
criterion = { version = "0.5", features = ["html_reports"] }

# Platform-specific fastembed features are set in member crates that need them
