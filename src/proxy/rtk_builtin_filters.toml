  "^\\s*$",
  "^==> Downloading",
  "^==> Pouring",
  "^Already downloaded:",
  "^###",
  "^==> Fetching",
]
match_output = [
  { pattern = "already installed", message = "ok (already installed)" },
]
max_lines = 20

[[tests.brew-install]]
name = "already installed short-circuits"
input = """
Warning: rtk 0.27.1 is already installed and up-to-date.
To reinstall 0.27.1, run:
