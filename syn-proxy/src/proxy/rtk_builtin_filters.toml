[[tests.basedpyright]]
name = "clean output"
input = """
basedpyright 1.22.0
Searching for source files
Found 10 source files

0 errors, 0 warnings, 0 informations
"""
expected = "0 errors, 0 warnings, 0 informations"

[[tests.basedpyright]]
name = "empty input returns on_empty message"
input = ""
expected = "basedpyright: ok"

[filters.ty]
description = "Compact ty type checker output - strip blank lines, keep errors"
match_command_regex = "^ty\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^Checking \\d+ file",
  "^ty \\d+\\.\\d+",
]
max_lines = 50
on_empty = "ty: ok"

[[tests.ty]]
name = "strips noise, keeps diagnostics"
input = """
ty 0.1.0
Checking 15 files

error[unresolved-reference]: Name `foo` used when not defined
  --> app/main.py:10:5
   |
10 |     foo()
   |     ^^^
   |

warning[unused-variable]: Variable `x` is not used
  --> app/utils.py:8:9
   |
 8 |     x = 42
   |     ^
   |

Found 1 error, 1 warning
"""
expected = "error[unresolved-reference]: Name `foo` used when not defined\n  --> app/main.py:10:5\n   |\n10 |     foo()\n   |     ^^^\n   |\nwarning[unused-variable]: Variable `x` is not used\n  --> app/utils.py:8:9\n   |\n 8 |     x = 42\n   |     ^\n   |\nFound 1 error, 1 warning"

[[tests.ty]]
name = "clean output"
input = """
ty 0.1.0
Checking 10 files

All checks passed!
"""
expected = "All checks passed!"

[[tests.ty]]
name = "empty input returns on_empty message"
input = ""
expected = "ty: ok"

[filters.helm]
description = "Compact helm output"
match_command_regex = "^helm\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^W\\d{4}",
]
truncate_lines_at = 120
max_lines = 40

[[tests.helm]]
name = "strips blank lines, preserves release info"
input = """
NAME: my-release
LAST DEPLOYED: Mon Jan 15 10:30:00 2024
NAMESPACE: default
STATUS: deployed
REVISION: 3

NOTES:
Application is running.
"""
expected = "NAME: my-release\nLAST DEPLOYED: Mon Jan 15 10:30:00 2024\nNAMESPACE: default\nSTATUS: deployed\nREVISION: 3\nNOTES:\nApplication is running."

[[tests.helm]]
name = "strips glog W-prefix warnings"
input = "W0115 10:30:00 warning message from internal\nNAME: my-chart\nSTATUS: deployed"
expected = "NAME: my-chart\nSTATUS: deployed"

[filters.just]
description = "Compact just task runner output - strip recipe headers, keep command output"
match_command_regex = "^just\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
  "^\\s*Available recipes:",
  "^\\s*just --list",
]
truncate_lines_at = 150
max_lines = 50

[[tests.just]]
name = "preserves command output"
input = "cargo test\n\ntest result: ok. 42 passed; 0 failed\n"
expected = "cargo test\ntest result: ok. 42 passed; 0 failed"

[[tests.just]]
name = "preserves error output"
input = "error: Compilation failed\nsrc/main.rs:10: expected `;`"
expected = "error: Compilation failed\nsrc/main.rs:10: expected `;`"

[[tests.just]]
name = "empty input"
input = ""
expected = ""

[filters.make]
description = "Compact make output"
match_command_regex = "^make\\b"
strip_lines_matching = [
  "^make\\[\\d+\\]:",
  "^\\s*$",
  "^Nothing to be done",
]
max_lines = 50
on_empty = "make: ok"

[[tests.make]]
name = "strips entering/leaving lines"
input = """
make[1]: Entering directory '/home/user'
gcc -O2 foo.c
make[1]: Leaving directory '/home/user'
"""
expected = "gcc -O2 foo.c"

[[tests.make]]
name = "strips blank lines"
input = """
gcc -O2 foo.c

gcc -O2 bar.c
"""
expected = "gcc -O2 foo.c\ngcc -O2 bar.c"

[[tests.make]]
name = "on_empty when all stripped"
input = """
make[1]: Entering directory '/home/user'
make[1]: Leaving directory '/home/user'
"""
expected = "make: ok"

[filters.gt-log]
description = "Compact Graphite log output - strip email addresses and cap stacked-PR graph rows"
match_command_regex = "^gt\\s+log\\b"
strip_ansi = true
replace = [
  { pattern = "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,}\\b", replacement = "" },
]
truncate_lines_at = 120
max_lines = 60

[[tests.gt-log]]
name = "strips emails and keeps graph entries"
input = """
◉  abc1234 feat/add-auth 2d ago user@example.com
│  feat(auth): add login endpoint
│
◉  def5678 main 3d ago admin@corp.io
│  chore: update dependencies
"""
expected = "◉  abc1234 feat/add-auth 2d ago \n│  feat(auth): add login endpoint\n│\n◉  def5678 main 3d ago \n│  chore: update dependencies"

[filters.gt-submit]
description = "Compact Graphite submit output - strip blank lines and cap branch/PR status"
match_command_regex = "^gt\\s+submit\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
]
truncate_lines_at = 140
max_lines = 60

[[tests.gt-submit]]
name = "keeps push and PR status"
input = """
Pushed branch feat/add-auth

Created pull request #42 for feat/add-auth
Updated pull request #40 for feat/add-db
"""
expected = "Pushed branch feat/add-auth\nCreated pull request #42 for feat/add-auth\nUpdated pull request #40 for feat/add-db"

[filters.gt-sync]
description = "Compact Graphite sync/restack/create output"
match_command_regex = "^gt\\s+(sync|restack|create)\\b"
strip_ansi = true
strip_lines_matching = [
  "^\\s*$",
]
truncate_lines_at = 140
max_lines = 50

[[tests.gt-sync]]
name = "keeps sync state without blank lines"
input = """
Synced with remote

Deleted branch old-stack
Restacked branch feat/auth
"""
expected = "Synced with remote\nDeleted branch old-stack\nRestacked branch feat/auth"
