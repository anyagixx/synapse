[package]
name = "syn-core"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Synapse foundation crate — config, utils, telemetry, tracking, memory, compression, hooks, agent console"

[features]
default = []
telemetry = ["dep:opentelemetry", "dep:opentelemetry-otlp", "dep:opentelemetry_sdk", "dep:tracing-opentelemetry"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
opentelemetry = { workspace = true, optional = true }
opentelemetry-otlp = { workspace = true, optional = true }
opentelemetry_sdk = { workspace = true, optional = true }
tracing-opentelemetry = { workspace = true, optional = true }
chrono.workspace = true
dirs.workspace = true
uuid.workspace = true
regex.workspace = true
colored.workspace = true
sha2.workspace = true
walkdir.workspace = true
globset.workspace = true
rusqlite.workspace = true
notify.workspace = true
tempfile.workspace = true
ignore.workspace = true

[lib]
name = "syn_core"
path = "src/lib.rs"
