[scenario]
name = "Full-cycle fixture smoke"
description = "Verify a Minimal fixture can execute command, write_file, and snapshot steps."
fixture = "minimal"
fail_fast = true

[[steps]]
command = "test -f synapsec.toml"
expected = { exit_code = 0 }

[[steps]]
command = "test -f docs/graph-index.xml"
expected = { exit_code = 0 }

[[steps]]
write_file = { path = "src/e2e_generated.txt", content = "generated\n" }

[[steps]]
command = "test -f src/e2e_generated.txt"
expected = { exit_code = 0 }

[[steps]]
command = 'printf "fixture ok\n"'
snapshot = "full-cycle-output"
expected = { exit_code = 0, stdout_contains = "fixture ok" }
