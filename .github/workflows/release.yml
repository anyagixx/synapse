name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  actions: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: syn-x86_64-unknown-linux-gnu.tar.gz
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            artifact: syn-aarch64-unknown-linux-gnu.tar.gz
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            artifact: syn-x86_64-apple-darwin.tar.gz
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            artifact: syn-aarch64-apple-darwin.tar.gz
            runner: macos-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        run: |
          for attempt in 1 2 3; do
            rustup toolchain install stable --profile minimal && break
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          rustup default stable

      - name: Build, package, and smoke release artifact
        run: bash scripts/release_install_smoke.sh
        env:
          SYN_RELEASE_TARGET: ${{ matrix.target }}
          SYN_RELEASE_ARTIFACT: ${{ matrix.artifact }}
          SYN_RELEASE_OUTPUT_DIR: dist

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}
            dist/${{ matrix.artifact }}.sha256
          if-no-files-found: error

  release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download workflow artifacts
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir release-assets
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Collect release assets
        run: |
          set -euo pipefail
          mkdir -p dist
          find release-assets -name 'syn-*.tar.gz' -exec cp {} dist/ \;
          find release-assets -name 'syn-*.tar.gz.sha256' -exec cat {} \; | sort -k2 > dist/SHA256SUMS
          for artifact in \
            syn-x86_64-unknown-linux-gnu.tar.gz \
            syn-aarch64-unknown-linux-gnu.tar.gz \
            syn-x86_64-apple-darwin.tar.gz \
            syn-aarch64-apple-darwin.tar.gz
          do
            test -f "dist/${artifact}"
            grep "  ${artifact}$" dist/SHA256SUMS >/dev/null
          done
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Upload to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            dist/syn-*.tar.gz
            dist/SHA256SUMS
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
