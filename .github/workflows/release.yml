name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          toolchain: stable
          profile: minimal

      - name: Build release
        run: cargo build --release

      - name: Package
        run: |
          mkdir -p dist
          cp target/release/syn dist/
          cp README.md GUIDE.md LICENSE dist/ 2>/dev/null || true
          tar -czf synapse-linux-x86_64.tar.gz -C dist .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: synapse-linux-x86_64.tar.gz
          draft: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
