name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  mygrace-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          for attempt in 1 2 3; do
            rustup toolchain install stable --profile minimal && break
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          rustup default stable
      - run: bash scripts/ci.sh

  release-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: syn-x86_64-unknown-linux-gnu.tar.gz
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            artifact: syn-aarch64-unknown-linux-gnu.tar.gz
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            artifact: syn-x86_64-apple-darwin.tar.gz
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            artifact: syn-aarch64-apple-darwin.tar.gz
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          for attempt in 1 2 3; do
            rustup toolchain install stable --profile minimal && break
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          rustup default stable
      - run: bash scripts/release_install_smoke.sh
        env:
          SYN_RELEASE_TARGET: ${{ matrix.target }}
          SYN_RELEASE_ARTIFACT: ${{ matrix.artifact }}

  platform-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          for attempt in 1 2 3; do
            rustup toolchain install stable --profile minimal && break
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          rustup default stable
      - run: cargo test --all-targets

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          for attempt in 1 2 3; do
            rustup toolchain install stable --profile minimal && break
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          rustup default stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings
