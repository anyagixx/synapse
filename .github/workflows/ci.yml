name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  mygrace-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install Rust
        run: |
          for attempt in 1 2 3; do
            rustup toolchain install stable --profile minimal && break
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          rustup default stable
      - run: bash scripts/ci.sh

  release-smoke:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            artifact: syn-x86_64-unknown-linux-gnu.tar.gz
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            artifact: syn-aarch64-unknown-linux-gnu.tar.gz
            runner: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            artifact: syn-x86_64-apple-darwin.tar.gz
            runner: macos-15-intel
          - target: aarch64-apple-darwin
            artifact: syn-aarch64-apple-darwin.tar.gz
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          for attempt in 1 2 3; do
            rustup toolchain install stable --profile minimal && break
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          rustup default stable
      - run: bash scripts/release_install_smoke.sh
        env:
          SYN_RELEASE_TARGET: ${{ matrix.target }}
          SYN_RELEASE_ARTIFACT: ${{ matrix.artifact }}

  fresh-install:
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
          - os: macos
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Run public installer fresh smoke
        run: bash scripts/fresh_install_smoke.sh
        env:
          SYN_INSTALL_SCRIPT_URL: https://raw.githubusercontent.com/anyagixx/synapse/${{ github.sha }}/install.sh
          SYN_INSTALL_SOURCE_REF: ${{ github.sha }}
      - name: Summarize fresh install evidence
        if: always()
        run: |
          {
            echo "## Fresh install smoke"
            echo ""
            echo "- OS: \`${{ matrix.os }}\`"
            echo "- Ref: \`${{ github.ref_name }}\`"
            echo "- Commit: \`${{ github.sha }}\`"
            echo "- Installer: \`raw.githubusercontent.com/anyagixx/synapse/${{ github.sha }}/install.sh\`"
            echo "- Command: \`bash scripts/fresh_install_smoke.sh\`"
            echo "- Install dir: temporary \`SYN_INSTALL_DIR\`"
          } >> "$GITHUB_STEP_SUMMARY"

  platform-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          for attempt in 1 2 3; do
            rustup toolchain install stable --profile minimal && break
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          rustup default stable
      - run: cargo test --all-targets

  coverage:
    runs-on: ubuntu-latest
    env:
      COVERAGE_THRESHOLD: 65
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          for attempt in 1 2 3; do
            rustup toolchain install stable --profile minimal && break
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          rustup default stable
      - name: Install cargo-tarpaulin
        run: cargo install cargo-tarpaulin --locked
      - name: Run coverage
        run: |
          cargo tarpaulin \
            --out Json \
            --output-dir coverage \
            --exclude-files 'tests/*' \
            --exclude-files 'benches/*' \
            --fail-under "$COVERAGE_THRESHOLD"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage/
      - name: Coverage summary
        if: always()
        run: |
          if [ -f coverage/tarpaulin-report.json ]; then
            COVERAGE=$(jq '.coverage' coverage/tarpaulin-report.json)
            echo "## Code Coverage: ${COVERAGE}% (threshold ${COVERAGE_THRESHOLD}%)" >> "$GITHUB_STEP_SUMMARY"
          fi

  benchmarks:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          for attempt in 1 2 3; do
            rustup toolchain install stable --profile minimal && break
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          rustup default stable
      - name: Run Criterion benchmark smoke
        run: |
          cargo bench --bench search
          cargo bench --bench graph
          cargo bench --bench cascade

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust
        run: |
          for attempt in 1 2 3; do
            rustup toolchain install stable --profile minimal && break
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            sleep $((attempt * 10))
          done
          rustup default stable
      - run: cargo install cargo-audit --locked
      - run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436
